<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스몰토크 — 순간의 말문이 막힐 때</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Hero -->
  <header class="hero">
    <div class="hero-inner">
      <p class="hero-label">SMALLTALK · 스몰토크</p>
      <h1>두 번 클릭이면,<br/>어색한 침묵이 끝납니다.</h1>
      <p class="tagline">소개팅 · 회식 · 미팅 직전에 필요한 대화 주제를 3초 안에.</p>
      <div class="price-pill">처음 3개는 무료 · 이후 900원</div>
    </div>
    <div class="hero-wave"></div>
  </header>

  <main class="container">
    <!-- 모드 선택 -->
    <section id="step-mode" class="card reveal">
      <h2 class="section-title">어떤 순간인가요?</h2>
      <div class="chips mode-chips">
        <span id="mode-scenario" class="chip active">👥 상황별 주제</span>
        <span id="mode-news" class="chip">📰 오늘의 화제</span>
        <span id="mode-facts" class="chip">🔍 신기한 사실</span>
      </div>
    </section>

    <!-- Step 1: 상황 -->
    <section id="step-situation" class="card reveal">
      <h2 class="section-title"><em>01</em> 상황을 선택하세요</h2>
      <div id="situation-grid" class="grid"></div>
    </section>

    <!-- Step 2: 상대 -->
    <section id="step-counterpart" class="card reveal" style="display:none">
      <h2 class="section-title"><em>02</em> 상대는 누구인가요?</h2>
      <div id="counterpart-chips" class="chips"></div>
    </section>

    <!-- Step 3: 피할 주제 -->
    <section id="step-avoid" class="card reveal" style="display:none">
      <h2 class="section-title"><em>03</em> 피할 주제 <span class="optional">선택</span></h2>
      <div id="avoid-chips" class="chips"></div>
      <button id="generate-btn" class="btn primary big">✨ 나만의 스몰토크 받기</button>
    </section>

    <!-- 로딩 -->
    <section id="loading" class="card center" style="display:none">
      <div class="spinner"></div>
      <p class="loading-text">어색해질 뻔했네요. 지금 만들고 있어요…</p>
    </section>

    <!-- 결과 -->
    <section id="result" class="card reveal" style="display:none">
      <div class="result-head">
        <h2 class="section-title no-margin">🎯 오늘의 추천</h2>
        <span id="free-badge" class="badge-free"></span>
      </div>

      <div id="topics"></div>

      <!-- 프리미엄 CTA -->
      <div id="premium-cta" class="premium-box" style="display:none">
        <p class="premium-line">나머지 <strong id="locked-count"></strong>개가 기다리고 있어요</p>
        <button id="unlock-btn" class="btn premium-btn">🔓 900원으로 전체 열기</button>
        <p class="note">한 번 결제 · 이 기기에서 계속 사용</p>
      </div>

      <!-- 팁 -->
      <div id="tips" class="tips-box">
        <h4>TIP</h4>
        <ul id="tips-list"></ul>
      </div>

      <button id="again-btn" class="btn ghost">🔄 다른 조합 보기</button>
    </section>
  </main>

  <footer class="footer">
    <p>스몰토크 ⓒ 2026 · 말문이 막히는 모든 순간에</p>
  </footer>

  <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
  <script src="/static/config.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
